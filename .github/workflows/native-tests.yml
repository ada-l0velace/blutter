name: Native tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        sdk: ['3.11.0', '3.13.4']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libicu-dev g++ valgrind llvm
          echo 'CC=gcc' >> "$GITHUB_ENV"
          echo 'CXX=g++' >> "$GITHUB_ENV"

      - name: macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install llvm icu4c cmake ninja pkgconf
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "CC=$(brew --prefix llvm)/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=$(brew --prefix llvm)/bin/clang++" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$(brew --prefix icu4c)" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$(brew --prefix icu4c)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Pinned ARM64 decoder
        shell: bash
        run: |
          git clone --quiet --depth 1 --branch 5.0.6 https://github.com/capstone-engine/capstone.git "$RUNNER_TEMP/capstone-source"
          test "$(git -C "$RUNNER_TEMP/capstone-source" rev-parse HEAD)" = accf4df62f1fba6f92cae692985d27063552601c
          cmake -S "$RUNNER_TEMP/capstone-source" -B "$RUNNER_TEMP/capstone-build" -GNinja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/capstone" \
            -DBUILD_SHARED_LIBS=ON -DBUILD_STATIC_LIBS=OFF \
            -DCAPSTONE_ARCHITECTURE_DEFAULT=OFF -DCAPSTONE_ARM64_SUPPORT=ON \
            -DCAPSTONE_BUILD_MACOS_THIN=ON -DCAPSTONE_BUILD_TESTS=OFF -DCAPSTONE_BUILD_CSTOOL=OFF
          cmake --build "$RUNNER_TEMP/capstone-build" --parallel 2
          cmake --install "$RUNNER_TEMP/capstone-build"
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/capstone/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/capstone/lib" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$RUNNER_TEMP/capstone/lib" >> "$GITHUB_ENV"

      - name: Python checker dependencies
        run: python3 -m pip install capstone==5.0.6 pyelftools==0.32

      - name: Runtime cache identity
        id: toolchain
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, subprocess
          compiler = subprocess.check_output([os.environ['CXX'], '--version'])
          icu = subprocess.check_output(['pkg-config', '--modversion', 'icu-uc'])
          identity = hashlib.sha256(compiler + icu).hexdigest()[:16]
          with pathlib.Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f'identity={identity}\n')
          PY

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: runtime
        with:
          path: packages
          key: runtime-${{ matrix.os }}-${{ runner.arch }}-${{ matrix.sdk }}-${{ steps.toolchain.outputs.identity }}-${{ hashFiles('dartvm_fetch_build.py', 'reader_profiles.py', 'scripts/CMakeLists.txt', 'scripts/dartvm_*.py', 'scripts/generate_thread_offsets_cpp.py', 'scripts/shorebird_*.patch') }}

      - name: Prepare matching runtime without an application
        if: steps.runtime.outputs.cache-hit != 'true'
        run: python3 dartvm_fetch_build.py '${{ matrix.sdk }}' android arm64

      - name: Checker and recognizer controls
        run: |
          python3 -m unittest discover -s tests/unit -p 'test_*.py'
          python3 tests/runners/run_arm64_patterns.py
          python3 tests/runners/run_snapshot_annotations.py
          node tests/unit/test_frida_decoders.js

      - name: Ordinary native tests and separate Linux Memcheck
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/native-logs"
          memcheck_args=()
          if [[ "$RUNNER_OS" == Linux ]]; then memcheck_args+=(--memcheck); fi
          python3 tests/runners/run_native_tests.py --version '${{ matrix.sdk }}' \
            --build-dir "$RUNNER_TEMP/native-release" "${memcheck_args[@]}" \
            > "$RUNNER_TEMP/native-logs/release.log" 2>&1

      - name: Separate ASan and UBSan build
        shell: bash
        run: |
          python3 tests/runners/run_native_tests.py --version '${{ matrix.sdk }}' \
            --build-dir "$RUNNER_TEMP/native-sanitize" --mode sanitize \
            > "$RUNNER_TEMP/native-logs/sanitize.log" 2>&1

      - name: GCC source coverage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 tests/runners/run_native_tests.py --version '${{ matrix.sdk }}' \
            --build-dir "$RUNNER_TEMP/native-coverage" --mode coverage \
            > "$RUNNER_TEMP/native-logs/coverage.log" 2>&1
          python3 tests/runners/report_native_coverage.py "$RUNNER_TEMP/native-coverage" \
            --output "$RUNNER_TEMP/native-logs/coverage.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-${{ matrix.os }}-${{ matrix.sdk }}
          path: ${{ runner.temp }}/native-logs/
          if-no-files-found: ignore
          retention-days: 7
